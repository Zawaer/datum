# docker compose --env-file /opt/bp/site.env up -d --build   (site.env: SITE=..., PREFIX=d-...; never committed)
services:
  app:
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: bp-demo:latest
    restart: unless-stopped
    env_file: [/opt/bp/app.env]          # ANTHROPIC_API_KEY, BP_* caps; chmod 600, outside the repo
    environment:
      BP_ROOT_PATH: /${PREFIX:?set PREFIX}
      # cross-check second detector (bp/crosscheck.py); its thresholds are copied into cache/crosscheck at start
      BP_XCHECK_CC_WEIGHTS: /srv/bundle/xcheck/best.pt
      BP_XCHECK_CC_TAG: v3s
      # fine-tuned VLM second opinion: precomputed answers for the bundle's CubiCasa questions (no GPU here)
      BP_XCHECK_VLM: /srv/bundle/xcheck/demo_secondopinion.jsonl
      # heavy image work takes its estimated peak from this budget and queues when it is full (bp/memgate.py);
      # with the server's own ~1.5 GB and at most 8 model-CLI processes (~220 MB each) it stays under mem_limit
      BP_MEM_BUDGET_GB: "8"
      BP_MEMGATE_LOG: "1"
      # few malloc arenas: freed image buffers go back to the OS (memgate also trims after each job)
      MALLOC_ARENA_MAX: "2"
    volumes:
      - /opt/bp/bundle/dataset:/srv/bundle/dataset:ro
      - /opt/bp/bundle/runs:/app/runs:ro
      - /opt/bp/bundle/analysis:/app/analysis/out:ro
      - cache:/app/cache
      - /opt/bp/bundle/weights:/app/cache/cubicasa/weights:ro
      - /opt/bp/bundle/xcheck:/srv/bundle/xcheck:ro
    expose: ["8000"]
    mem_limit: 12g
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE: ${SITE:?set SITE}
      PREFIX: ${PREFIX:?set PREFIX}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  cache: {}
  caddy_data: {}
  caddy_config: {}
