<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blueprints that talk</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <button class="iconbtn only-phone" id="drawerbtn" aria-label="Drawings">☰</button>
  <a class="brand" href="/"><span class="logo">▦</span> Blueprints <em>that talk</em></a>
  <nav class="links">
    <button class="linkbtn" id="tourbtn">▶ Demo tour</button>
    <a class="linkbtn" href="/results">Scoreboard</a>
  </nav>
  <div class="meter" id="meter" title="What this session's questions cost us vs what a frontier vision model would have cost (measured on our baseline run)">
    <div class="mrow"><span class="mlab">ours</span><span class="mbar"><i id="bar-ours"></i></span><b id="m-ours">$0</b></div>
    <div class="mrow"><span class="mlab">frontier</span><span class="mbar"><i id="bar-base" class="base"></i></span><b id="m-base">$0</b></div>
    <div class="msum" id="m-sum">ask something</div>
  </div>
</header>
<main>
  <nav id="list">
    <label class="upload" id="uploadbox">
      <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.dxf,.ifc" hidden>
      <b>⬆ Upload your drawing</b><small>PDF · PNG · JPG · DXF · IFC, or drop it anywhere</small>
    </label>
    <div class="tabs" id="tabs"></div>
    <input class="search" id="search" placeholder="filter by file name…">
    <div id="items"></div>
    <button class="more" id="more" hidden>show more</button>
  </nav>
  <section id="viewer">
    <div id="stage"><img id="img" alt=""><svg id="ov" viewBox="0 0 1 1"></svg></div>
    <div id="three"></div>
    <div class="modes" id="modes"><button id="m2d" class="on">Plan</button><button id="m3d">3D model</button></div>
    <div class="tools3d" id="tools3d">
      <label>Storey <select id="storey"></select></label>
      <label class="cut">Section <input type="range" id="cut" min="0" max="1000" value="1000"></label>
    </div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit">⤢</button></div>
    <div class="hint" id="hint" hidden></div>
    <div class="loading" id="loading" hidden><span class="spin big"></span><div id="loadmsg">Loading…</div></div>
    <div class="empty" id="empty" hidden></div>
    <div class="caption" id="caption" hidden>
      <div class="capstep" id="capstep"></div><div class="captitle" id="captitle"></div><div class="captext" id="captext"></div>
      <div class="capnav"><button id="tprev">‹ back</button><button id="tnext" class="primary">next ›</button><button id="texit">exit tour</button></div>
    </div>
    <div class="credit" id="credit"></div>
    <div class="dropzone" id="dropzone" hidden>Drop the drawing to upload it</div>
  </section>
  <aside id="side">
    <div class="ask"><input id="q" placeholder="Ask in any language, e.g. How many windows?" autocomplete="off"><button id="go">Ask</button></div>
    <div class="qs"><h3 id="qstitle">Questions for this drawing</h3><div class="chips" id="chips"></div></div>
    <div class="card" id="answer" hidden></div>
    <div id="evwrap" hidden>
      <div class="evhead"><h3 id="evtitle">Evidence</h3>
        <button class="btn ghost" id="addbtn" title="Click the drawing to add an item the solver missed">+ add missed item</button></div>
      <div class="evhelp" id="evhelp"></div>
      <div class="ev" id="ev"></div>
    </div>
  </aside>
</main>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as V3 from '/static/view3d.js';
window.V3 = V3;
V3.init(document.getElementById('three'), {onPick: g => window.onPick3d(g), onHover: g => window.onHover3d(g)});
window.dispatchEvent(new Event('v3ready'));
</script>
<script src="/static/app.js"></script>
</body>
</html>
